    function encryptText(text, pwd) {
      if (!pwd) return text;
      return CryptoJS.AES.encrypt(text, pwd).toString();
    }

    function decryptText(cipher, pwd) {
      if (!pwd) return cipher;
      try {
        const bytes = CryptoJS.AES.decrypt(cipher, pwd);
        const str = bytes.toString(CryptoJS.enc.Utf8);
        return str || null;
      } catch (e) {
        return null;
      }
    }

    class DB {
      constructor() {
        this.name = 'SingleNotebook_v2';
        this.version = 1;
        this.db = null;
      }
      async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.name, this.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('folders')) db.createObjectStore('folders', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('tags')) db.createObjectStore('tags', { keyPath: 'id' });
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            this.seed().then(() => resolve(this.db));
          };
          req.onerror = (e) => reject(e.target.error);
        });
      }
      async seed() {
        const notes = await this.getNotes();
        if (notes.length === 0) {
          const demo = {
            id: 'note-welcome',
            title: 'Chào mừng bạn đến với Notebook 📝',
            content: '<h1>Chào mừng bạn!</h1><p>Ứng dụng ghi chú cá nhân hỗ trợ nhập xuất file JSON, TXT, DOCX, MD, HTML và bảo mật mã hóa mật khẩu AES-256.</p>',
            folderId: '',
            categoryId: '',
            tags: ['Chào mừng'],
            color: '#3b82f6',
            emoji: '📝',
            isPinned: true,
            isFavorite: true,
            isTrashed: false,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            mode: 'wysiwyg'
          };
          await this.saveNote(demo);
        }
      }
      async getNotes() {
        await this.init();
        return new Promise((res) => {
          const tx = this.db.transaction('notes', 'readonly');
          const req = tx.objectStore('notes').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      }
      async saveNote(note) {
        await this.init();
        return new Promise((res) => {
          const tx = this.db.transaction('notes', 'readwrite');
          tx.objectStore('notes').put(note);
          tx.oncomplete = () => res(note);
        });
      }
      async deleteNote(id, perm = false) {
        await this.init();
        return new Promise((res) => {
          const tx = this.db.transaction('notes', 'readwrite');
          const store = tx.objectStore('notes');
          if (perm) {
            store.delete(id);
          } else {
            const req = store.get(id);
            req.onsuccess = () => {
              if (req.result) store.put({ ...req.result, isTrashed: true });
            };
          }
          tx.oncomplete = () => res(true);
        });
      }
      async restoreNote(id) {
        await this.init();
        return new Promise((res) => {
          const tx = this.db.transaction('notes', 'readwrite');
          const store = tx.objectStore('notes');
          const req = store.get(id);
          req.onsuccess = () => {
            if (req.result) store.put({ ...req.result, isTrashed: false });
          };
          tx.oncomplete = () => res(true);
        });
      }

        localStorage.setItem('cookieConsent', val);
        setShow(false);
      };

      if (!show) return null;

      return (
        <div className="fixed bottom-4 right-4 left-4 md:left-auto md:max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-5 z-50">

    function ExportModal({ isOpen, onClose, note, allNotes, folders }) {
      const [format, setFormat] = useState('json');
      const [scope, setScope] = useState('single');

      if (!isOpen) return null;

      const handleExport = async () => {
        const targetNotes = scope === 'single' ? (note ? [note] : []) : allNotes;
        if (targetNotes.length === 0) return alert('Không có ghi chú nào');

        if (targetNotes.length === 1 && scope === 'single') {
          const n = targetNotes[0];
          const filename = (n.title || 'ghi-chu').replace(/[/\\?%*:|"<>]/g, '-');
          let content = n.content;
          let mime = 'text/plain';

          if (format === 'json') {
            content = JSON.stringify(n, null, 2);
            mime = 'application/json';
          } else if (format === 'txt') {
            content = n.title + '\n\n' + n.content.replace(/<[^>]+>/g, '');
          } else if (format === 'md') {
            content = '# ' + n.title + '\n\n' + (window.TurndownService ? new TurndownService().turndown(n.content) : n.content);
          } else if (format === 'html') {
            content = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${n.title}</title></head><body><h1>${n.title}</h1>${n.content}</body></html>`;
            mime = 'text/html';
          } else if (format === 'docx') {
            content = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body><h2>${n.title}</h2>${n.content}</body></html>`;
            mime = 'application/msword';
          }

          const blob = new Blob([content], { type: `${mime};charset=utf-8` });
          saveAs(blob, `${filename}.${format}`);
        } else {
          const zip = new JSZip();
          targetNotes.forEach((n) => {
            const fname = (n.title || 'note').replace(/[/\\?%*:|"<>]/g, '-');
            let data = n.content;
            if (format === 'json') data = JSON.stringify(n, null, 2);
            else if (format === 'txt') data = n.title + '\n\n' + n.content.replace(/<[^>]+>/g, '');
            else if (format === 'md') data = '# ' + n.title + '\n\n' + (window.TurndownService ? new TurndownService().turndown(n.content) : n.content);
            zip.file(`${fname}.${format}`, data);
          });
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          saveAs(zipBlob, `Notebook_Export_${Date.now()}.zip`);
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-bold">Xuất dữ liệu Ghi chú</h2>
              <button onClick={onClose}><Icon name="x" /></button>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 uppercase block mb-2">Phạm vi</label>
              <div className="grid grid-cols-2 gap-2 text-xs">
                <button onClick={() => setScope('single')} className={`p-2.5 rounded-xl border ${scope === 'single' ? 'bg-blue-50 border-blue-500 font-bold text-blue-600' : 'border-slate-200'}`}>Ghi chú hiện tại</button>
                <button onClick={() => setScope('all')} className={`p-2.5 rounded-xl border ${scope === 'all' ? 'bg-blue-50 border-blue-500 font-bold text-blue-600' : 'border-slate-200'}`}>Tất cả ({allNotes.length})</button>
              </div>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 uppercase block mb-2">Định dạng</label>
              <div className="grid grid-cols-3 gap-2 text-xs">
                {['json', 'txt', 'docx', 'md', 'html'].map((f) => (
                  <button key={f} onClick={() => setFormat(f)} className={`p-2.5 rounded-xl border uppercase font-semibold ${format === f ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-200 dark:border-slate-700'}`}>
                    .{f}
                  </button>
                ))}
              </div>
            </div>
            <div className="pt-2 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 text-xs font-semibold">Hủy</button>
              <button onClick={handleExport} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md">Tải xuống</button>
            </div>
          </div>
        </div>
      );
    }

    function ImportModal({ isOpen, onClose, onImport }) {
      if (!isOpen) return null;

      const handleFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        const title = file.name.replace(/\.[^/.]+$/, '');

        if (ext === 'json') {
          const text = await file.text();
          try {
            const data = JSON.parse(text);
            if (Array.isArray(data)) {
              data.forEach(n => onImport(n));
            } else if (data.title) {
              onImport(data);
            }
          } catch(err) {
            alert('File JSON không hợp lệ');
          }
        } else if (ext === 'txt' || ext === 'md' || ext === 'html') {
          const text = await file.text();
          let content = text;
          if (ext === 'md' && window.marked) content = marked.parse(text);
          onImport({
            id: `import-${Date.now()}`,
            title: title,
            content: ext === 'txt' ? `<p>${text.replace(/\n/g, '<br/>')}</p>` : content,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        } else {
          const text = await file.text();
          onImport({
            id: `import-${Date.now()}`,
            title: title,
            content: text,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        }
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 max-w-md w-full border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-bold">Nhập tập tin ghi chú</h2>
              <button onClick={onClose}><Icon name="x" /></button>
            </div>
            <div className="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800" onClick={() => document.getElementById('importInput').click()}>
              <Icon name="upload" className="w-10 h-10 mx-auto text-slate-400 mb-2" />
              <p className="text-sm font-semibold">Chọn file từ máy tính</p>
              <p className="text-xs text-slate-400 mt-1">Hỗ trợ JSON, TXT, DOCX, MD, HTML</p>
              <input id="importInput" type="file" accept=".json,.txt,.docx,.doc,.md,.html" className="hidden" onChange={handleFile} />
            </div>
            <div className="flex justify-end">
              <button onClick={onClose} className="px-4 py-2 text-xs font-semibold">Đóng</button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [notes, setNotes] = useState([]);
      const [folders, setFolders] = useState([]);
      const [categories, setCategories] = useState([]);
      const [activeNoteId, setActiveNoteId] = useState(null);
      const [activeView, setActiveView] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [theme, setTheme] = useState('light');
      const [lang, setLang] = useState('vi');
      const [unlocked, setUnlocked] = useState({});
      const [showExport, setShowExport] = useState(false);
      const [showImport, setShowImport] = useState(false);

      const t = translations[lang] || translations.vi;

      useEffect(() => {
        async function load() {
          const n = await db.getNotes();
          const f = await db.getFolders();
          const c = await db.getCategories();
          setNotes(n);
          setFolders(f);
          setCategories(c);
          if (n.length > 0) setActiveNoteId(n[0].id);
        }
        load();
      }, []);

      const activeNote = notes.find(n => n.id === activeNoteId);

      const handleCreate = async () => {
        const newN = {
          id: `note-${Date.now()}`,
          title: t.noteTitlePlaceholder,
          content: '<p></p>',
          folderId: '',
          categoryId: '',
          tags: [],
          color: '#3b82f6',
          emoji: '📝',
          isPinned: false,
          isFavorite: false,
          isTrashed: false,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          mode: 'wysiwyg'
        };
        await db.saveNote(newN);
        setNotes(prev => [newN, ...prev]);
        setActiveNoteId(newN.id);
      };

      const handleSave = async (updated) => {
        const n = { ...updated, updatedAt: Date.now() };
        await db.saveNote(n);
        setNotes(prev => prev.map(item => item.id === n.id ? n : item));
      };

      const handleDelete = async (id) => {
        await db.deleteNote(id, false);
        setNotes(prev => prev.map(n => n.id === id ? { ...n, isTrashed: true } : n));
      };

      const filtered = useMemo(() => {
        return notes.filter(n => {
          if (activeView === 'trash') return n.isTrashed;
          if (n.isTrashed) return false;
          if (activeView === 'favorites') return n.isFavorite;
          if (activeView === 'pinned') return n.isPinned;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q);
          }
          return true;
        });
      }, [notes, activeView, searchQuery]);

      return (
        <div className={`flex flex-col h-screen overflow-hidden ${theme === 'dark' ? 'dark bg-slate-900 text-white' : 'bg-slate-50 text-slate-800'}`}>
          <header className="h-14 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 flex items-center justify-between z-10 shrink-0">
            <div className="flex items-center gap-2">
              <span className="text-xl">📝</span>
              <span className="font-bold text-slate-800 dark:text-slate-100">{t.appName}</span>
            </div>

            <div className="flex-1 max-w-md mx-4 relative">
              <Icon name="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
              <input
                type="text"
                placeholder={t.searchPlaceholder}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-slate-100 dark:bg-slate-800 rounded-xl pl-9 pr-4 py-1.5 text-sm outline-none"
              />
            </div>

            <div className="flex items-center gap-2">
              <button onClick={handleCreate} className="flex items-center gap-1 bg-blue-600 text-white px-3 py-1.5 rounded-xl text-sm font-semibold">
                <Icon name="plus" className="w-4 h-4" />
                <span>{t.newNote}</span>
              </button>
              <button onClick={() => setShowImport(true)} className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" title={t.import}>
                <Icon name="upload" className="w-4 h-4" />
              </button>
              <button onClick={() => setShowExport(true)} className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" title={t.export}>
                <Icon name="download" className="w-4 h-4" />
              </button>
              <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
                <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
              </button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            <aside className="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 space-y-2">
              {[
                { id: 'all', icon: 'fileText', label: t.allNotes },
                { id: 'favorites', icon: 'star', label: t.favorites },
                { id: 'pinned', icon: 'pin', label: t.pinned },
                { id: 'trash', icon: 'trash', label: t.trash }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveView(item.id)}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-medium ${activeView === item.id ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-600 font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}
                >
                  <Icon name={item.icon} className="w-4 h-4" />
                  <span>{item.label}</span>
                </button>
              ))}
            </aside>

            <div className="w-80 border-r border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 p-2 space-y-2 overflow-y-auto">
              {filtered.map(n => (
                <div
                  key={n.id}
                  onClick={() => setActiveNoteId(n.id)}
                  className={`p-3 rounded-2xl cursor-pointer border transition ${n.id === activeNoteId ? 'bg-white dark:bg-slate-800 border-blue-500 shadow-sm' : 'bg-white/60 dark:bg-slate-800/40 border-transparent hover:bg-white'}`}
                >
                  <h3 className="font-semibold text-sm truncate">{n.emoji} {n.title || 'Ghi chú'}</h3>
                  <p className="text-xs text-slate-500 line-clamp-2 mt-1">{n.content.replace(/<[^>]+>/g, '') || 'Nội dung trống'}</p>
                </div>
              ))}
            </div>

            <main className="flex-1 bg-white dark:bg-slate-900 flex flex-col p-6 overflow-y-auto">
              {activeNote ? (
                <div className="max-w-3xl w-full mx-auto space-y-4">
                  <div className="flex items-center justify-between">
                    <input
                      type="text"
                      value={activeNote.title || ''}
                      onChange={(e) => handleSave({ ...activeNote, title: e.target.value })}
                      placeholder={t.noteTitlePlaceholder}
                      className="text-2xl font-bold bg-transparent outline-none w-full"
                    />
                    <button onClick={() => handleDelete(activeNote.id)} className="p-2 text-red-500 hover:bg-red-50 rounded-xl">
                      <Icon name="trash" />
                    </button>
                  </div>
                  <div
                    contentEditable
                    suppressContentEditableWarning
                    onBlur={(e) => handleSave({ ...activeNote, content: e.target.innerHTML })}
                    dangerouslySetInnerHTML={{ __html: activeNote.content || '' }}
                    className="min-h-[400px] outline-none editor-content text-slate-700 dark:text-slate-200"
                  />
                </div>
              ) : (
                <div className="m-auto text-center text-slate-400">
                  <p className="font-semibold">{t.noNotes}</p>
                </div>
              )}
            </main>
          </div>

          <CookieModal lang={lang} />
          <ExportModal isOpen={showExport} onClose={() => setShowExport(false)} note={activeNote} allNotes={notes} folders={folders} />
          <ImportModal isOpen={showImport} onClose={() => setShowImport(false)} onImport={(n) => { handleSave(n); setNotes(p => [n, ...p]); }} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
